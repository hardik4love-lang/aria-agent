name: ARIA Rapid Payout Radar & Human-in-the-Loop Dispatcher

on:
  schedule:
    # Runs hourly 24/7 in GitHub Actions Cloud
    - cron: '15 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/aria_human_in_loop_radar.py'
      - 'scripts/scan_and_verify_rapid_jobs.py'
      - 'src/aria/verification/**'
      - '.github/workflows/aria-rapid-payout-radar-24x7.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aria-rapid-payout-radar
  cancel-in-progress: false

jobs:
  rapid-payout-radar:
    name: Rapid Payout Scanner & Telegram Dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install httpx

      - name: Execute Triple-Agent Scan & Telegram Alert Cycle
        env:
          PYTHONPATH: src:.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/aria_human_in_loop_radar.py

      - name: Commit & Push Verified Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore(telemetry): update verified rapid payout telemetry [skip ci]"
          git push origin main || echo "No changes or remote push suppressed"
