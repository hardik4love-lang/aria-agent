name: ARIA Autonomous CI & PR Review Self-Healing Guardian

on:
  schedule:
    # Runs every 30 minutes 24/7/365 to monitor all in-flight PRs
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/aria/github/pr_review_fixer.py'
      - 'daemon/pr_guardian_daemon.py'
      - '.github/workflows/aria-pr-guardian.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr-guardian-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase & Persistent State
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_AGENT_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Zero-Cost Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run PR Guardian Self-Healing Cycle
        env:
          GH_TOKEN: ${{ secrets.GH_AGENT_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_AGENT_PAT || secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_AGENT_PAT || secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8585331609:AAFa_foTU82ToL7EFBiZ3EIrSbCDCfW0cPA' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8737013099' }}
        run: |
          python daemon/pr_guardian_daemon.py --run-once

      - name: Persist PR Healing Logs & State
        if: always()
        run: |
          git config --global user.name "ARIA Guardian Daemon"
          git config --global user.email "aria-daemon@users.noreply.github.com"
          git add data/pr_healing_log.jsonl state/review_fixes.jsonl state/pr_cooldown_tracker.json || true
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(guardian): update PR healing logs & review state [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || true
          else
            echo "No new healing logs or state to commit."
          fi
