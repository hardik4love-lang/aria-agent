name: ARIA Automated Maintenance & Self-Healing

on:
  schedule:
    # Runs every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Prune & Consolidate Memory
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python -c "
          from aria.tools.memory_tools import MemoryTools
          tools = MemoryTools()
          res = tools.memory_summarize_old_context(max_items=100)
          print('Memory consolidation result:', res)
          "

      - name: Verify Quota Health
        run: |
          python -c "
          from aria.llm.quota import QuotaTracker
          q = QuotaTracker()
          snap = q.get_snapshot()
          print('Quota Health Snapshot:', snap)
          "

      - name: Commit Maintenance Updates
        if: always()
        run: |
          git config --global user.name "ARIA Maintenance Bot"
          git config --global user.email "aria-maintenance@users.noreply.github.com"
          git add state/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore(maintenance): automated memory consolidation and quota sync [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No state updates to commit."
          fi
